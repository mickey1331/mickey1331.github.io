# 顶部导航栏条目（中英双语）
#
# 英文是默认语言，页面在根路径；中文页面在 /zh/ 下。
# 每张页面通过 front matter 的 lang 字段选择导航：
#   lang: en（默认）读取 main
#   lang: zh          读取 main_zh
# 增删条目即可调整对应语言导航栏的显示内容与顺序。
#
# 目前每个语言保留四个选项卡：Publications / Research / Awards / CV。
# Talks / Teaching / Portfolio / Blog Posts 的页面已移到 _drafts/（不参与构建），
# 以后有内容时把文件移回 _pages/ 并在此处加回对应条目即可。

main:
  - title: "Publications"
    url: /publications/

  - title: "Research"
    url: /research/

  - title: "Awards"
    url: /awards/

  - title: "CV"
    url: /cv/

  # - title: "CV"
  #   url: /cv-json/

main_zh:
  - title: "Publications"
    url: /zh/publications/

  - title: "Research"
    url: /zh/research/

  - title: "Awards"
    url: /zh/awards/

  - title: "CV"
    url: /zh/cv/
